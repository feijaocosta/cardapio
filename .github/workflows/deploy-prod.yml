name: Deploy to Production (GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: feijao
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            export PATH="$PATH:/usr/local/bin:$HOME/.npm-global/bin"

            APP_ROOT="$HOME/cardapio-app"
            APP_DIR="$APP_ROOT/production"
            BRANCH="main"
            PROCESS_NAME="production"
            PORT="3002"
            DB_PATH="../cardapio-prod.db"
            REPO_SSH="git@github.com:${{ github.repository }}.git"

            mkdir -p "$APP_ROOT"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Clonando repositório em $APP_DIR"
              git clone "$REPO_SSH" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            npm ci --include=dev
            npm --prefix server ci --include=dev
            npm run build

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            cat > server/.env <<EOF
            NODE_ENV=production
            PORT=$PORT
            DATABASE_PATH=$DB_PATH
            EOF

            if pm2 describe "$PROCESS_NAME" >/dev/null 2>&1; then
              pm2 restart "$PROCESS_NAME" --update-env
            else
              pm2 start npm --name "$PROCESS_NAME" --cwd "$APP_DIR/server" -- run dev
            fi

            pm2 save
            sleep 5  # Dê 5 segundos para o servidor respirar e subir
            pm2 status "$PROCESS_NAME"

            HEALTH_URL="http://127.0.0.1:$PORT/health"
            for i in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null; then
                echo "Healthcheck OK em $HEALTH_URL"
                exit 0
              fi
              sleep 2
            done

            echo "Healthcheck falhou para $HEALTH_URL"
            pm2 logs "$PROCESS_NAME" --lines 120 --nostream || true
            exit 1
