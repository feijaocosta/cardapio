name: Deploy to Staging (GCP)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: feijao
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            APP_ROOT="$HOME/cardapio-app"
            APP_DIR="$APP_ROOT/staging"
            BRANCH="staging"
            PROCESS_NAME="staging"
            PORT="3001"
            DB_PATH="../cardapio-staging.db"
            REPO_SSH="git@github.com:${{ github.repository }}.git"

            mkdir -p "$APP_ROOT"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Clonando repositório em $APP_DIR"
              git clone "$REPO_SSH" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            npm ci
            npm --prefix server ci
            npm run build

            cat > server/.env <<EOF
            NODE_ENV=staging
            PORT=$PORT
            DATABASE_PATH=$DB_PATH
            EOF

            if pm2 describe "$PROCESS_NAME" >/dev/null 2>&1; then
              pm2 restart "$PROCESS_NAME" --update-env
            else
              pm2 start npm --name "$PROCESS_NAME" --cwd "$APP_DIR/server" -- run dev
            fi

            pm2 save
            pm2 status "$PROCESS_NAME"
            curl -fsS "http://127.0.0.1:$PORT/health"
