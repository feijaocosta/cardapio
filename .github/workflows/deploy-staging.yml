name: Deploy to Staging (GCP)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Pack dist artifact
        run: tar -czf staging-dist.tar.gz dist

      - name: Artifact metadata
        id: meta
        run: echo "artifact_name=staging-dist-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: staging-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .

      - name: Upload dist package to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: feijao
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          port: 22
          source: staging-dist.tar.gz
          target: /tmp

      - name: Extract dist in staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: feijao
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            APP_ROOT="$HOME/cardapio-app"
            APP_DIR="$APP_ROOT/staging"
            PORT="3001"
            DIST_PACKAGE="/tmp/staging-dist.tar.gz"

            mkdir -p "$APP_ROOT"

            if [ ! -f "$DIST_PACKAGE" ]; then
              echo "Pacote dist não encontrado: $DIST_PACKAGE"
              exit 1
            fi

            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR/dist.new"
            mkdir -p "$APP_DIR/dist.new"
            tar -xzf "$DIST_PACKAGE" -C "$APP_DIR/dist.new"

            if [ ! -d "$APP_DIR/dist.new/dist" ]; then
              echo "Estrutura inválida no artifact (dist ausente)"
              exit 1
            fi

            rm -rf "$APP_DIR/dist.prev"
            if [ -d "$APP_DIR/dist" ]; then
              mv "$APP_DIR/dist" "$APP_DIR/dist.prev"
            fi
            mv "$APP_DIR/dist.new/dist" "$APP_DIR/dist"
            rm -rf "$APP_DIR/dist.new"
            rm -f "$DIST_PACKAGE"

            HEALTH_URL="http://127.0.0.1:$PORT/health"
            for i in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null; then
                echo "Healthcheck OK em $HEALTH_URL"
                exit 0
              fi
              sleep 2
            done

            echo "Healthcheck falhou para $HEALTH_URL"
            command -v pm2 >/dev/null 2>&1 && pm2 logs staging --lines 120 --nostream || true
            exit 1
